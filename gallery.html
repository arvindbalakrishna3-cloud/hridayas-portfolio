<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Gallery | Hridayas</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Shared Navigation -->
    <nav>
        <a href="index.html" class="logo">Hridayas</a>
        <button class="hamburger" id="hamburger-menu" aria-label="Toggle Navigation">
            <span></span><span></span><span></span>
        </button>
        <ul class="nav-links" id="menu">
            <li><a href="index.html#home">HOME</a></li>
            <li><a href="index.html#designs">EXPERTISE</a></li>
            <li><a href="gallery.html" style="color: var(--primary);">GALLERY</a></li>
            <li><a href="index.html#about">ABOUT</a></li>
            <li><a href="index.html#contact">CONTACT US</a></li>
        </ul>
    </nav>

    <!-- Gallery Page Header -->
    <header class="page-header">
        <h1>Our Portfolio</h1>
        <p>A closer look at the spaces we've transformed.</p>
    </header>

    <!-- Full Image Bento Grid -->
    <section class="full-gallery">
        <div class="gallery-grid">
            <div class="gallery-item large">
                <img src="gallery/maya5.jpg" alt="Modern Living Space" class="lightbox-trigger" loading="lazy">
            </div>
            <div class="gallery-item">
                <img src="gallery/anil3.jpg" alt="Interior Detail" class="lightbox-trigger" loading="lazy">
            </div>
            <div class="gallery-item tall">
                <img src="gallery/anil4.jpg" alt="Custom Wardrobe" class="lightbox-trigger" loading="lazy">
            </div>
            <div class="gallery-item wide">
                <img src="gallery/maya6.jpg" alt="Modular Kitchen Setup" class="lightbox-trigger" loading="lazy">
            </div>
            <div class="gallery-item">
                <img src="gallery/palavakkam7.jpg" alt="Kids Zone Interior" class="lightbox-trigger" loading="lazy">
            </div>
            <div class="gallery-item">
                <img src="gallery/1.jpeg" alt="Restaurant Styling" class="lightbox-trigger" loading="lazy">
            </div>
            <div class="gallery-item wide">
                <img src="gallery/anil2.jpg" alt="Bedroom Overview" class="lightbox-trigger" loading="lazy">
            </div>
            <div class="gallery-item">
                <img src="gallery/grand1.png" alt="Material Finish" class="lightbox-trigger" loading="lazy">
            </div>
            <div class="gallery-item tall">
                <img src="gallery/grand2.jpg" alt="Living Room Detail" class="lightbox-trigger" loading="lazy">
            </div>
            <div class="gallery-item">
                <img src="gallery/4.png" alt="Furniture Selection" class="lightbox-trigger" loading="lazy">
            </div>
            <div class="gallery-item wide">
                <img src="gallery/ramanium1.jpg" alt="Kitchen Island" class="lightbox-trigger" loading="lazy">
            </div>
            <div class="gallery-item">
                <img src="gallery/ramanium3.jpg" alt="Detail Shot" class="lightbox-trigger" loading="lazy">
            </div>
            <div class="gallery-item">
                <img src="gallery/sus4.jpg" alt="Bathroom Design" class="lightbox-trigger" loading="lazy">
            </div>
        </div>
    </section>

    <!-- Shared Footer -->
    <footer>
        <div class="footer-logo">HRIDAYAS</div>
        <p>&copy; 2026 Studio KA. All Rights Reserved.</p>
    </footer>

    <!-- Shared Lightbox -->
    <div id="lightbox" class="lightbox" aria-hidden="true">
        <button class="lightbox-close" aria-label="Close">&times;</button>
        <img class="lightbox-img" src="" alt="" />
        <p class="lightbox-caption"></p>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
